[project]
name = "[[.ProjectName]]"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = [
    "B311",
    "B110",
]
